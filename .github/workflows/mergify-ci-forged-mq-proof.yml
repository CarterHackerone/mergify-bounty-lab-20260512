name: mergify-ci-forged-mq-proof

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: scopes
        uses: Mergifyio/gha-mergify-ci@v17
        with:
          action: scopes

      - name: Show detected scopes
        run: |
          echo "detected_base=${{ steps.scopes.outputs.base }}"
          echo "detected_head=${{ steps.scopes.outputs.head }}"
          echo 'detected_scopes=${{ steps.scopes.outputs.scopes }}'
