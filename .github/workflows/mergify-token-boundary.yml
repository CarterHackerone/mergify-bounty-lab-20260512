name: mergify-token-boundary

on:
  workflow_dispatch:

permissions:
  actions: read
  checks: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Mergify with repository-scoped GITHUB_TOKEN
        env:
          GH_TOKEN_UNDER_TEST: ${{ github.token }}
        run: |
          set -euo pipefail

          probe() {
            label="$1"
            url="$2"
            code="$(curl -sS -o "resp-${label}.txt" -w "%{http_code}" \
              -H "Authorization: Bearer ${GH_TOKEN_UNDER_TEST}" \
              -H "Accept: application/json" \
              "${url}")"
            bytes="$(wc -c < "resp-${label}.txt" | tr -d ' ')"
            snippet="$(head -c 220 "resp-${label}.txt" | tr '\n' ' ' | sed -E 's/[A-Za-z0-9_-]{32,}/[redacted-long-token]/g')"
            echo "${label} status=${code} bytes=${bytes} body=${snippet}"
          }

          probe github_private_repo https://api.github.com/repos/CarterHackerone/mergify-private-lab-20260512
          probe mergify_application https://api.mergify.com/v1/application
          probe mergify_public_status https://api.mergify.com/v1/repos/CarterHackerone/mergify-bounty-lab-20260512/merge-queue/status
          probe mergify_private_config https://api.mergify.com/v1/repos/CarterHackerone/mergify-private-lab-20260512/config
          probe mergify_private_status https://api.mergify.com/v1/repos/CarterHackerone/mergify-private-lab-20260512/merge-queue/status
