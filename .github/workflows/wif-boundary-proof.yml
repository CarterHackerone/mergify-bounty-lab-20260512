name: wif-boundary-proof

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt Mergify GCP workload identity auth
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/370784745717/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@github-400420.iam.gserviceaccount.com
          create_credentials_file: true
          token_format: access_token

      - name: Report harmless result
        if: always()
        shell: bash
        run: |
          {
            echo "auth_outcome=${{ steps.auth.outcome }}"
            echo "auth_conclusion=${{ steps.auth.conclusion }}"
            if [[ -n "${{ steps.auth.outputs.credentials_file_path }}" ]]; then
              echo "credentials_file_created=true"
            else
              echo "credentials_file_created=false"
            fi
          } | tee "$GITHUB_STEP_SUMMARY"

          if command -v gcloud >/dev/null 2>&1; then
            gcloud auth list --filter=status:ACTIVE --format='value(account)' || true
          fi
