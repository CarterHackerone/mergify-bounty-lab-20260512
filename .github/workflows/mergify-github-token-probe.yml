name: Mergify GitHub Token Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mergify-github-token-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Mergify auth with GitHub Actions token
        env:
          PROBE_TOKEN: ${{ github.token }}
        run: |
          set +euo pipefail

          call_api() {
            label="$1"
            method="$2"
            url="$3"
            body="${4:-}"
            tmp="$(mktemp)"
            if [ -n "$body" ]; then
              code="$(curl -sS -o "$tmp" -w "%{http_code}" -X "$method" \
                -H "Authorization: Bearer ${PROBE_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "$body" \
                "$url")"
            else
              code="$(curl -sS -o "$tmp" -w "%{http_code}" -X "$method" \
                -H "Authorization: Bearer ${PROBE_TOKEN}" \
                "$url")"
            fi
            detail="$(jq -r 'if type == "object" then (.detail // .message // .error // empty) else empty end' "$tmp" 2>/dev/null | head -c 160)"
            bytes="$(wc -c < "$tmp" | tr -d " ")"
            printf "%s status=%s bytes=%s detail=%s\n" "$label" "$code" "$bytes" "$detail"
            rm -f "$tmp"
          }

          api="https://api.mergify.com/v1"
          gh_api="https://api.github.com"

          call_api github_user GET "${gh_api}/user"
          call_api github_repo_read GET "${gh_api}/repos/CarterHackerone/mergify-bounty-lab-20260512"
          call_api github_private_read GET "${gh_api}/repos/CarterHackerone/mergify-private-lab-20260512"
          call_api mergify_application GET "${api}/application"
          call_api mergify_public_queue_status GET "${api}/repos/CarterHackerone/mergify-bounty-lab-20260512/merge-queue/status"
          call_api mergify_private_queue_status GET "${api}/repos/CarterHackerone/mergify-private-lab-20260512/merge-queue/status"
