name: Forged MQ scope upload proof

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: Mergifyio/gha-mergify-ci@v17
        id: scopes
        with:
          action: scopes
          token: ${{ secrets.MERGIFY_CI_SCOPE_PROOF_TOKEN }}
      - name: Show detected scopes
        run: |
          echo 'detected_scopes=${{ steps.scopes.outputs.scopes }}'
