queue_rules:
  - name: default
    queue_conditions:
      - check-success=lab-ci
    merge_conditions:
      - check-success=lab-ci
    merge_method: squash

pull_request_rules:
  - name: queue labeled pull requests
    conditions:
      - label=merge-queue
    actions:
      queue:
        name: default
  - name: template sandbox arithmetic probe
    conditions:
      - label=ssti-probe
    actions:
      comment:
        message: "ssti-probe arithmetic={{ 7 * 7 }} author={{ author }}"
