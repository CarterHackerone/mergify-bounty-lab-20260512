scopes:
  source:
    files:
      readme:
        include:
          - README.md
  merge_queue_scope: merge-queue

queue_rules:
  - name: default
    queue_conditions:
      - check-success=lab-ci
    merge_conditions:
      - check-success=lab-ci
    merge_method: squash

pull_request_rules:
  - name: queue labeled pull requests
    conditions:
      - label=merge-queue
    actions:
      queue:
        name: default
