queue_rules:
  - name: 'q`<img src=x onerror="document.body.dataset.conditionDescriptionXss=1">`'
    queue_conditions:
      - check-success=lab-ci
    merge_conditions:
      - check-success=lab-ci
    merge_method: squash

pull_request_rules:
  - name: queue labeled pull requests
    conditions:
      - label=merge-queue
    actions:
      queue:
        name: 'q`<img src=x onerror="document.body.dataset.conditionDescriptionXss=1">`'
