queue_rules:
  - name: 'q`<iframe srcdoc="<script>parent.document.body.dataset.conditionDescriptionXss=1</script>"></iframe>`'
    queue_conditions:
      - check-success=lab-ci
    merge_conditions:
      - check-success=lab-ci
    merge_method: squash

pull_request_rules:
  - name: queue labeled pull requests
    conditions:
      - label=merge-queue
    actions:
      queue:
        name: 'q`<iframe srcdoc="<script>parent.document.body.dataset.conditionDescriptionXss=1</script>"></iframe>`'
